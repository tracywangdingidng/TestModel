# Server Configuration
server.port=8080
server.servlet.context-path=/task-scheduler

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:task_scheduler;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
spring.redis.jedis.pool.max-active=100
spring.redis.jedis.pool.max-idle=20
spring.redis.jedis.pool.min-idle=5
spring.redis.jedis.pool.max-wait=3000ms

# WebSocket Configuration
spring.websocket.path=/ws/task-status

# Task Scheduler Configuration
task.scheduler.core-pool-size=10
task.scheduler.max-pool-size=20
task.scheduler.queue-capacity=100
task.scheduler.thread-name-prefix=TaskScheduler-

# Distributed Lock Configuration
distributed.lock.expire-time=30000ms
distributed.lock.retry-times=3
distributed.lock.retry-interval=1000ms